<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pistach</title>
    <link rel="icon" type="image/png" href="/pistach/pistach.png" />
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Inter:wght@400;600;700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/pistach/pistach.css" />
    <style>
        main { min-height: 100vh; display: grid; place-content: center; text-align: center; padding-top: 0; padding-bottom: 0; }
        .mark { margin: 0 auto 1.25rem; }
        #detail { color: var(--muted); max-width: 26rem; margin: 0 auto; }
    </style>
</head>
<body>
    <!-- Landing page for Google / Slack connections started from Claude (Pistach MCP connect_account). -->
    <main>
        <img class="mark" src="/pistach/pistach.png" alt="" width="96" height="96" />
        <h1 id="title">Pistach</h1>
        <p id="detail"></p>
    </main>
    <script>
        const q = new URLSearchParams(location.search);
        const name = q.get("provider") === "slack" ? "Slack" : "Google";
        const kind = q.get("kind") === "pro" ? "Pro" : "Perso";
        const ok = q.get("status") === "ok";
        document.getElementById("title").textContent = ok ? `✓ ${name} connecté` : "Connexion échouée";
        document.getElementById("detail").textContent = ok
            ? (name === "Google"
                ? `Ton compte est relié à Pistach en ${kind} : Agenda, Gmail et Drive. Tu peux fermer cette page et revenir dans Claude.`
                : `Ton espace Slack est relié à Pistach en ${kind}. Tu peux fermer cette page et revenir dans Claude.`)
            : (q.get("message") || "Réessaie en demandant un nouveau lien à Claude.");
    </script>
</body>
</html>
